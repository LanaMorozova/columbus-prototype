<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Enter password &#8211; HACG Website Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --navy-900:#001f3d; --navy-800:#003366; --navy-700:#14355a; --navy-deep:#002950;
  --blue:#1668b3; --blue-dark:#00478f; --teal:#2a6b7c; --teal-hover:#235a69; --teal-light:#84c3d2;
  --ink:#525252; --ink-strong:#001f3d; --text-plain:#1a1a1a;
  --line:#e6eaf0; --line-strong:#c6ced8; --line-card-hover:#d3dfec; --radio:#6b7a8d;
  --bg:#f6f8fa; --white:#ffffff; --sky:#e1f1f4; --tile:#d5e3f8; --chip:#eaf1fc; --chip-hover:#e2ecf8; --hover:#f0f6fc;
  --ok-bg:#f1f9f4; --ok:#1b6b45; --bad-bg:#fdf4f4; --bad:#9b2c2c;
  --muted:#aab8cc; --muted2:#a9bcd2; --map-land:#e8eef3;
  --focus:#ffc107;
  --font:"Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shadow-card:0 6px 20px rgba(0,31,61,.10);
  --gutter:max(16px, env(safe-area-inset-left, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--navy-800)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i16{width:16px;height:16px} svg.i20{width:20px;height:20px} svg.i24{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:600;font-size:16px;line-height:24px;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.btn-primary{background:var(--teal);color:#fff;padding:16px 28px;min-height:56px}
.btn-primary:hover{background:var(--teal-hover)}

/* ---------- password gate: UI only. Server-side auth goes through window.HACGAuth (see script at the end) ---------- */
.gate{position:fixed;inset:0;z-index:1000;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
.gate-hdr{background:var(--navy-800);padding:22px var(--gutter)}
.gate-hdr .in{max-width:1200px;margin:0 auto}
.gate-logo{display:block;width:198px;height:64px}
.gate-logo img{width:100%;height:100%;object-fit:contain;object-position:left center}
.gate-main{flex:1 0 auto;display:flex;align-items:center;justify-content:center;padding:72px var(--gutter)}
.gate-card{width:100%;max-width:480px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:24px}
.gate-head h1{margin:0;font-size:28px;line-height:36px;font-weight:700;color:var(--ink-strong)}
.gate-head h1:focus{outline:none}
.gate-head p{margin:8px 0 0;font-size:16px;line-height:26px}
.gate-form{display:flex;flex-direction:column;gap:24px;margin:0}
.gate-field{display:flex;flex-direction:column;gap:8px}
.gate-field label{font-weight:600;color:var(--ink-strong)}
.gate-input{position:relative}
.gate-input input{display:block;width:100%;height:52px;padding:0 56px 0 14px;border:1.5px solid var(--radio);border-radius:12px;background:#fff;font-size:16px;color:var(--ink-strong)}
.gate-input input:hover{border-color:var(--blue)}
.gate-input input:focus{outline:none;border-color:var(--navy-800);box-shadow:0 0 0 1px var(--navy-800)}
.gate-input input[aria-invalid="true"]{border-color:var(--bad)}
.gate-input input[aria-invalid="true"]:focus{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.gate-toggle{position:absolute;top:4px;right:4px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--navy-800)}
.gate-toggle:hover{background:var(--hover)}
.gate-error{display:flex;gap:8px;align-items:flex-start;margin:0;color:var(--bad);font-size:14px;line-height:21px;font-weight:600}
.gate-error:empty{display:none}
.gate-error svg{margin-top:2px}
.gate .btn-primary{width:100%}
.gate .btn-primary[aria-disabled="true"]{cursor:progress;background:var(--teal-hover)}
.gate .gate-toggle:focus-visible,.gate .btn:focus-visible{outline:3px solid var(--navy-800);outline-offset:3px}
.gate-spin{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:gate-spin .8s linear infinite}
@keyframes gate-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.gate-spin{animation:none;border-color:#fff;border-right-color:rgba(255,255,255,.45)}}
@media (max-width:600px){
  .gate-hdr{padding:12px 20px}
  .gate-logo{width:180px}
  .gate-main{align-items:flex-start;padding:40px 20px}
  .gate-card{padding:20px;gap:20px}
  .gate-head h1{font-size:24px;line-height:32px}
  .gate-form{gap:20px}
}

</style>
</head>

<script>
/* =====================================================================
   HACGAuth: the only code that talks to the server. The UI below never
   sees or compares a password; it only calls login() / checkSession().
   No password is stored in this file.

   Contract for the Cloudflare Worker (change the endpoints in config):
     POST /api/auth/login     body: {"password":"..."}  (JSON)
       200 {"ok":true}   + Set-Cookie: session; HttpOnly; Secure; SameSite=Strict; Path=/
       401 {"ok":false}  wrong password
       429               too many attempts
     GET  /api/auth/session
       200 {"authenticated":true}    valid session cookie
       401 {"authenticated":false}
   Responses must be JSON, so a static fallback page (HTML 200) is never
   mistaken for a successful login.
   ===================================================================== */
window.HACGAuth=(function(){
 var config={loginEndpoint:"/api/auth/login",sessionEndpoint:"/api/auth/session",timeoutMs:10000};
 function request(url,opts){
  var ctrl=typeof AbortController!=="undefined"?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort()},config.timeoutMs):null;
  var o=Object.assign({credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}},opts||{});
  if(ctrl)o.signal=ctrl.signal;
  return fetch(url,o).finally(function(){if(timer)clearTimeout(timer)});
 }
 function readJson(r){
  if(!/application\/json/i.test(r.headers.get("content-type")||""))return Promise.resolve(null);
  return r.json().catch(function(){return null});
 }

  return request(config.sessionEndpoint).then(function(r){
   if(!r.ok)return false;
   return readJson(r).then(function(d){return !!(d&&d.authenticated===true)});

 }

    if(r.status===401||r.status===403)return {status:"invalid"};
    if(r.status===429)return {status:"rate_limited"};
    if(!r.ok)return {status:"unavailable"};
    return readJson(r).then(function(d){return d&&d.ok===true?{status:"ok"}:{status:"unavailable"}});
   })
   .catch(function(){return {status:"unavailable"}});
 }
 return {config:config,checkSession:checkSession,login:login};
})();
</script>
<script>
/* Password screen UI: visual states only. All checks go through window.HACGAuth. */
(function(){
 var $=function(id){return document.getElementById(id)};
 var form=$("gate-form"),pw=$("gate-pw"),toggle=$("gate-toggle"),err=$("gate-error"),submit=$("gate-submit");
 var busy=false;
 var MSG={
  empty:"Enter the password to continue.",
  invalid:"Incorrect password. Please try again.",
  rate_limited:"Too many attempts. Wait a few minutes and try again.",
  unavailable:"We could not check the password right now. Please try again later."
 };
 function enter(){
  /* the prototype is only served after login, so load it fresh from the server */
  location.replace("/");
 }
 function showError(kind){
  err.innerHTML='<svg class="i i16" aria-hidden="true" focusable="false"><use href="#i-info"/></svg><span></span>';
  err.lastChild.textContent=MSG[kind]||MSG.unavailable;
  pw.setAttribute("aria-invalid","true");
 }
 function clearError(){err.textContent="";pw.removeAttribute("aria-invalid")}
 function setBusy(on){
  busy=on;
  form.setAttribute("aria-busy",String(on));
  submit.setAttribute("aria-disabled",String(on));
  submit.innerHTML=on?'<span class="gate-spin" aria-hidden="true"></span><span>Checking\u2026</span>':"View prototype";
 }
 function setVisible(show){
  pw.type=show?"text":"password";
  toggle.setAttribute("aria-label",show?"Hide password":"Show password");
  toggle.querySelector("use").setAttribute("href",show?"#i-eye-off":"#i-eye");
 }
 toggle.addEventListener("click",function(){setVisible(pw.type==="password")});
 pw.addEventListener("input",function(){if(pw.hasAttribute("aria-invalid"))clearError()});
 form.addEventListener("submit",function(e){
  e.preventDefault();
  if(busy)return;
  clearError();
  if(!pw.value){showError("empty");pw.focus();return}
  setVisible(false);
  setBusy(true);
  window.HACGAuth.login(pw.value).then(function(res){
   if(res.status==="ok"){pw.value="";enter();return}
   setBusy(false);
   showError(res.status);
   pw.focus();pw.select();
  });
 });
 /* Review states without logging in: /?gate-state=empty|invalid|rate_limited|unavailable|loading (display only). */
 var preview=null;try{preview=new URLSearchParams(location.search).get("gate-state")}catch(e){}
 if(preview){
  if(preview==="loading"){pw.value="password";setBusy(true)}
  else if(MSG[preview]){if(preview!=="empty")pw.value="password";showError(preview)}
  return;
 }
 window.HACGAuth.checkSession().then(function(ok){if(ok)enter()});
})();
</script>
